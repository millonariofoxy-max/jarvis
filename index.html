<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b12" />
    <meta name="description" content="Habla por voz con Vos, tu asistente virtual." />
    <title>Vos — Asistente de voz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#voz" aria-label="Vos, asistente de voz">
        <span class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>vos<span class="brand-period">.</span></span>
      </a>
      <button class="clear-chat" id="clear-chat" type="button">Nueva conversación</button>
    </header>

    <main id="voz">
      <section class="voice-panel" aria-labelledby="voice-title">
        <div class="voice-orb" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="eyebrow">TU ASISTENTE DE VOZ</p>
        <h1 id="voice-title">Hablemos.</h1>
        <p class="voice-description">Toca el micrófono y háblame. Te voy a responder en voz alta.</p>
        <p class="voice-status" id="voice-status" role="status" aria-live="polite">Toca el micrófono para hablar</p>
        <button class="mic-button" id="mic-button" type="button" aria-label="Empezar a hablar" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4m-4 0h8"/></svg>
        </button>
        <p class="voice-hint">Pulsa el botón para empezar a hablar</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
